<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>受付終了 | 人生の転機に、次の一手を整える人生設計ウェビナー</title>
    <meta name="description" content="2026年7月29日開催の無料ウェビナーは終了しました。次回のご案内は、メルマガ「時の羅針盤」でお届けしています。">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <style>
      /* 受付終了ページ専用（2026-07-30 差し替え）。styles.css の変数・部品をそのまま使う */
      .closed {
        display: grid;
        align-content: start;
      }

      .closed-photo {
        margin: 0;
        height: clamp(220px, 36vh, 400px);
      }

      .closed-panel {
        display: grid;
        align-content: center;
        gap: 14px;
        padding: clamp(30px, 8vw, 64px) clamp(20px, 6vw, 60px);
        background: var(--white);
      }

      .closed-panel h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(23px, 5.4vw, 33px);
        font-weight: 600;
        line-height: 1.55;
      }

      .closed-lead {
        margin: 0;
        font-weight: 700;
      }

      .closed-copy {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      @media (min-width: 760px) {
        .closed {
          grid-template-columns: 1fr 1fr;
          align-items: stretch;
          min-height: calc(100vh - 58px);
        }

        .closed-photo {
          height: auto;
          min-height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header" aria-label="ページ上部">
      <span class="brand-logo">
        <img src="./assets/first-class-logo.png" alt="First Class by Seiko Meguro">
      </span>
    </header>

    <main class="closed">
      <figure class="closed-photo">
        <img src="./assets/final-stairs.jpg" alt="広い階段に座る目黒せいこさん" style="--pos: 50% 48%;" fetchpriority="high">
      </figure>

      <div class="closed-panel">
        <p class="eyebrow">THANK YOU</p>
        <h1>7月29日のウェビナーは<br>終了しました</h1>
        <p class="closed-lead">ご参加くださったみなさま、ありがとうございました。</p>
        <p class="closed-copy">このページからのお申し込みの受付は終了しています。次回の開催や、人生の転機に次の一手をどう選ぶかについては、メルマガ「時の羅針盤」でお届けしています。</p>

        <div class="cta-block">
          <p class="cta-reason">次回のご案内は、メルマガから先にお送りします。</p>
          <a class="button button-primary" href="https://x.gd/7LiG7">メルマガ「時の羅針盤」を受け取る</a>
          <p class="microcopy">購読は無料です。いつでも解除できます。</p>
        </div>
      </div>
    </main>

    <footer class="site-footer" aria-label="ブランド情報">
      <img src="./assets/first-class-logo.png" alt="First Class by Seiko Meguro">
    </footer>
  </body>
